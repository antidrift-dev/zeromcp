name: Publish Swift (subtree push)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.3.0). Required when running manually — github.ref_name is "main" on manual dispatch, not the release tag.'
        required: true
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_SUBTREE }}

      - name: Push subtree to zeromcp-swift
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.PAT_SUBTREE }}@github.com" > ~/.git-credentials
          SHA=$(git subtree split --prefix=swift HEAD)
          git push "https://github.com/antidrift-dev/zeromcp-swift.git" "$SHA:refs/heads/main" --force
          git push "https://github.com/antidrift-dev/zeromcp-swift.git" "$SHA:refs/tags/$TAG" --force
